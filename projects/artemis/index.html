	<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

	<style>
		:root {
			--bg:      #0d0b08;
			--fg:      #d8cbb0;
			--dim:     #7d7259;
			--amber:   #ffb000;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Pixelify Sans", monospace;
			font-weight: 500;
			font-size: 18px;
			line-height: 1.7;
			letter-spacing: 0.02em;
			background: var(--bg);
			color: var(--fg);
		}

		body::after {
			content: "";
			position: fixed;
			inset: 0;
			pointer-events: none;
			z-index: 10;
			background: repeating-linear-gradient(
				to bottom,
				rgba(0,0,0,0) 0px,
				rgba(0,0,0,0) 2px,
				rgba(0,0,0,0.22) 3px,
				rgba(0,0,0,0.22) 4px
			);
		}

		#main-content {
			max-width: 900px;
			margin: 0 auto;
			padding: 4rem 1.5rem 6rem;
		}

		.meta {
			margin: 0.35rem 0;
			color: var(--dim);
		}

		a {
			color: var(--amber);
			text-decoration: none;
			border-bottom: 1px dotted var(--amber);
		}
		a:hover,
		a:focus-visible {
			background: var(--amber);
			color: var(--bg);
			border-bottom-color: transparent;
			outline: none;
		}
	</style>
</head>
<body>
	<main id="main-content">

		<p class="meta">
			<a href="artemis.apk" download>artemis.apk</a> Android client
		</p>

	</main>
</body>
